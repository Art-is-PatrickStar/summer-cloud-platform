server:
  port: 9001

spring:
  profiles:
    active: dev
  application:
    name: summer-cloud-product-service
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: root
      timeout: 5000
      lettuce:
        pool:
          enabled: true
          max-active: 10
          max-wait: 5000
          min-idle: 5
          max-idle: 10
          time-between-eviction-runs: 1000
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/summer-cloud-platform?useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: root
    hikari:
      #连接超时时间,小于250毫秒,否则被重置为默认值30秒
      connection-timeout: 60000
      #空闲连接超时时间,默认值600000单位毫秒,大于等于max-lifetime且max-lifetime>0,会被重置为0,不等于0且小于10秒,会被重置为10秒
      idle-timeout: 500000
      #连接最大存活时间,不等于0且小于30秒,会被重置为默认值30分钟,设置应该比mysql设置的超时时间短
      max-lifetime: 540000
      #最小空闲连接,默认值10,小于0或大于maximum-pool-size,都会重置为maximum-pool-size
      minimum-idle: 5
      #最大连接数,小于等于0会被重置为默认值10,大于零小于1会被重置为minimum-idle的值
      maximum-pool-size: 20
      pool-name: HikariPool-product-service

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration.log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
